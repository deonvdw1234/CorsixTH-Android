# Nieto Software build: a release APK signed with the debug key.
# Needs no repository secrets. Firebase is left out because there is no
# google-services.json (see build.gradle).
# Created by Nieto Software

name: Nieto Build

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: nieto-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out code and the CorsixTH submodule
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CorsixTH-Nieto-${{ github.run_number }}
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error
